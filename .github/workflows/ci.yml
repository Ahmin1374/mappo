name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests
        run: ./mvnw -B test 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "Tests run:|ERROR|BUILD" build.log | grep -v -E "^\[ERROR\] *$" | tail -25 | cut -c1-220 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Build log::${msg}"

  frontend:
    name: Frontend (Node 20 / Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mappo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mappo/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npx ng build
